name: offline_first
description: "Flutter adapters for offline_first_core: sqflite outbox store, connectivity_plus trigger, AES-GCM cipher with secure key storage."
version: 0.0.1
publish_to: none
homepage: https://github.com/your-github-username/offline_first
repository: https://github.com/your-github-username/offline_first
issue_tracker: https://github.com/your-github-username/offline_first/issues

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  offline_first_core:
    path: ../offline_first_core
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  connectivity_plus: ^6.0.0
  flutter_secure_storage: ^9.0.0
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
